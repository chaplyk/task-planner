name: Publish to Google Play

on:
  push:
    tags:
      - '*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Publish to Google Play
        uses: deep-rent/publish-android-release@v2.1.3
        with:
          project-directory: '.'
          package-name: 'com.chaplyk.memory'
          keystore: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          key-alias: 'mykey'
          key-password: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          service-account: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON_BASE64 }}
          track: 'internal'
          status: 'completed'
